        .active-btn {
            background-color: #10b981; /* Emerald-500 */

            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: cover;

        // --- Functions ---

        /**
         * Renders the recipe cards to the DOM based on the provided recipe array.
         * @param {Array} recipesToRender - The array of recipe objects to display.
         */
        function renderRecipes(recipesToRender) {
            recipeContainer.innerHTML = ''; // Clear existing recipes

            if (recipesToRender.length === 0) {
                recipeContainer.innerHTML = '<p class="text-gray-500 text-center col-span-full">No recipes match the current filter.</p>';
                return;
            }

            recipesToRender.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow-lg p-5 border border-gray-200 hover:shadow-xl transition-shadow duration-200 flex flex-col'; // Added flex properties

                // Get base substance image
                const baseImgSrc = substanceImages[recipe.baseSubstance] || fallbackImageUrl;
                const baseImgAlt = `${recipe.baseSubstance} icon`;

                // Format ingredients list with images
                const ingredientsList = recipe.ingredients.map(ing => {
                    const ingImgSrc = substanceImages[ing] || fallbackImageUrl;
                    const ingImgAlt = `${ing} icon`;
                    // Added onerror to fallback to a generic placeholder if a specific one fails
                    return `<li class="ingredient-item text-sm text-gray-600">
                                <img src="${ingImgSrc}" alt="${ingImgAlt}" class="substance-img-small" onerror="this.onerror=null;this.src='${fallbackImageUrl}';">
                                ${ing}
                            </li>`;
                }).join('');

                // Format effects list (no images for effects)
                const effectsList = recipe.effects.map(eff =>
                    `<li class="text-sm text-gray-600">${eff}</li>`
                ).join('');

                card.innerHTML = `
                    <div class="flex items-center mb-2">
                         <img src="${baseImgSrc}" alt="${baseImgAlt}" class="substance-img-base" onerror="this.onerror=null;this.src='${fallbackImageUrl}';">

                            <span class="block text-xs text-gray-500 uppercase">Cost</span>
                            <span class="block text-lg font-semibold text-red-600">$${recipe.cost}</span>
                        </div>
                        <div>
                            <span class="block text-xs text-gray-500 uppercase">Price</span>
                            <span class="block text-lg font-semibold text-blue-600">$${recipe.price}</span>
                        </div>
                        <div>
                            <span class="block text-xs text-gray-500 uppercase">Profit</span>
                            <span class="block text-lg font-semibold text-green-600">$${recipe.profit}</span>
                        </div>
                    </div>
                    <div class="flex-grow grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <h4 class="font-semibold text-sm mb-1 text-gray-800">Ingredients (Order Matters):</h4>
                            <ul class="list-none pl-0">${ingredientsList}</ul> </div>
                        <div>
                            <h4 class="font-semibold text-sm mb-1 text-gray-800">Effects:</h4>
                            <ul class="list-disc list-inside pl-2">${effectsList}</ul>
                        </div>
                    </div>
                `;
                recipeContainer.appendChild(card);
            });
        }

        /**
         * Filters and sorts the recipes based on current state, then renders them.
         */
        function updateDisplay() {
            // 1. Filter
            let filteredRecipes = recipes;
            if (currentFilter !== 'All') {
                filteredRecipes = recipes.filter(recipe => recipe.baseSubstance === currentFilter);
            }

            // 2. Sort
            const { key, direction } = currentSort;
            filteredRecipes.sort((a, b) => {
                let comparison = 0;
                // Handle potential non-numeric values gracefully during sort
                const valA = (typeof a[key] === 'string' && key !== 'name') ? parseFloat(a[key]) || 0 : a[key];
                const valB = (typeof b[key] === 'string' && key !== 'name') ? parseFloat(b[key]) || 0 : b[key];

                if (valA < valB) {
                    comparison = -1;
                } else if (valA > valB) {
                    comparison = 1;
                }
                return direction === 'desc' ? (comparison * -1) : comparison;
            });

             // Update button styles
             sortButtons.forEach(button => {
                const sortKey = button.dataset.sort;
                 // Clear existing arrows first
                button.innerHTML = `${sortKey.charAt(0).toUpperCase() + sortKey.slice(1)}`;

                if (sortKey === currentSort.key) {
                    button.classList.remove('inactive-btn');
                    button.classList.add('active-btn');
                    // Add arrow indicator for sort direction
                    button.innerHTML += ` ${currentSort.direction === 'desc' ? '▼' : '▲'}`;
                } else {
                    button.classList.remove('active-btn');
                    button.classList.add('inactive-btn');
                }
            });


            // 3. Render
            renderRecipes(filteredRecipes);
        }

        // --- Event Listeners ---

        // Filter select change
        filterSubstanceSelect.addEventListener('change', (event) => {
            currentFilter = event.target.value;
            updateDisplay();
        });

        // Sort button clicks
        sortButtons.forEach(button => {
            button.addEventListener('click', () => {
                const sortKey = button.dataset.sort;

                // If clicking the same key, toggle direction, otherwise set to default
                if (currentSort.key === sortKey) {
                    currentSort.direction = currentSort.direction === 'desc' ? 'asc' : 'desc';
                } else {
                    currentSort.key = sortKey;
                    // Default sort directions: desc for profit/price, asc for cost/name
                    currentSort.direction = (sortKey === 'cost' || sortKey === 'name') ? 'asc' : 'desc';
                }
                updateDisplay();
            });
        });

        // --- Initial Render ---
        // Perform initial sort and render on page load
        updateDisplay();

    </script>

</body>
</html>
